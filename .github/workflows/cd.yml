name: CD
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build image
        run: docker build -f infra/Dockerfile -t pm-api:latest .
      - name: Deploy (placeholder)
        run: |
          echo "Implement platform-specific deployment here (Fly.io/AWS ECS)."
          # Example Fly.io:
          # flyctl deploy --config infra/fly.toml
      - name: DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install -r requirements.txt
          alembic -c app/db/migrations/alembic.ini upgrade head
      - name: Health check
        run: |
          echo "Run health check against /health after deploy"
